[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "router-dump-analyzer-demo"
version = "0.1.0"
description = "Runnable Router State Lab review application and synthetic demo plug-ins"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Router Dump Analyzer design team" }]
dependencies = [
  "router-dump-analyzer-core>=0.1.0,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-core>=2.20,<3",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
router-dump-demo = "router_dump_analyzer_demo.app:main"

[tool.hatch.build.targets.wheel]
packages = [
  "src/router_dump_analyzer_demo",
  "src/router_dump_analyzer_demo_plugins",
]

[tool.hatch.build.targets.wheel.force-include]
"frontend" = "router_dump_analyzer_demo/frontend"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/frontend",
  "/README.md",
  "/pyproject.toml",
]
