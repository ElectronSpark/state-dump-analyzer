[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "router-dump-analyzer-demo"
version = "0.1.0"
description = "Example Router Dump Analyzer plug-in and generated fixture tooling"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Router Dump Analyzer design team" }]
classifiers = ["Typing :: Typed"]
dependencies = [
  "router-dump-analyzer-core>=0.1.0,<1",
  "pydantic-core>=2.20,<3",
]

[project.entry-points."router_dump_analyzer.plugins"]
demo_router = "rsl_demo_plugin:plugin"

[tool.hatch.build.targets.wheel]
packages = [
  "rsl_demo_plugin",
  "rsl_demo_generator",
]

[tool.hatch.build.targets.wheel.force-include]
"fixtures/minimal-status.jsonl" = "rsl_demo_plugin/fixtures/minimal-status.jsonl"
"router-state-lab-default.scenario.json" = "rsl_demo_generator/router-state-lab-default.scenario.json"

[tool.hatch.build.targets.sdist]
include = [
  "/rsl_demo_plugin",
  "/rsl_demo_generator",
  "/fixtures/minimal-status.jsonl",
  "/router-state-lab-default.scenario.json",
  "/README.md",
  "/pyproject.toml",
]
