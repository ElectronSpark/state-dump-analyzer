[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "router-dump-analyzer-core"
version = "0.1.0"
description = "Core contracts and generic engines for a temporal router dump analyzer"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Router Dump Analyzer design team" }]
dependencies = []

[project.optional-dependencies]
test = []

[project.scripts]
router-dump-plugin-validate = "router_dump_analyzer.plugin_validation:main"

[tool.hatch.build.targets.wheel]
packages = ["src/router_dump_analyzer"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
