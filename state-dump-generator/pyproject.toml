[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "state-dump-generator"
version = "0.1.0"
description = "Standalone temporal router state-dump scenario editor and generator"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Router State Lab contributors" }]
classifiers = ["Typing :: Typed"]
dependencies = []

[project.scripts]
state-dump-generator = "state_dump_generator.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/state_dump_generator"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/environment.yml",
  "/launch.cmd",
  "/launch.ps1",
  "/launch.sh",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
