[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "router-dump-analyzer-minimal-plugin"
version = "0.1.0"
description = "Minimal installable AnalyzerPlugin example"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "router-dump-analyzer-design>=0.1.0,<1",
]

[project.entry-points."router_dump_analyzer.plugins"]
minimal_router = "minimal_router_plugin:plugin"

[tool.setuptools.packages.find]
where = ["src"]
